name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: darwin_arm64
            bin: qam
            format: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: darwin_amd64
            bin: qam
            format: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: linux_amd64
            bin: qam
            format: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: linux_arm64
            bin: qam
            format: tar.gz
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: windows_amd64
            bin: qam.exe
            format: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilation toolchain (Linux aarch64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
            export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
            export AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar
          fi
          cargo build --release --target ${{ matrix.target }} --bin qam

      - name: Package archive
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          fi

          DIST_DIR="dist"
          STAGE_DIR="stage_${{ matrix.archive }}"
          mkdir -p "$DIST_DIR" "$STAGE_DIR"

          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          cp "$BIN_PATH" "$STAGE_DIR/"
          cp LICENSE README.md "$STAGE_DIR/"

          ARCHIVE_NAME="qam_${VERSION}_${{ matrix.archive }}"

          if [ "${{ matrix.format }}" = "zip" ]; then
            (cd "$STAGE_DIR" && 7z a "../${DIST_DIR}/${ARCHIVE_NAME}.zip" *)
          else
            tar -czvf "${DIST_DIR}/${ARCHIVE_NAME}.tar.gz" -C "$STAGE_DIR" .
          fi

      - name: Upload artifact for release job
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.archive }}
          path: dist/*

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all built assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        shell: bash
        working-directory: dist
        run: |
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
