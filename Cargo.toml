[package]
name = "qam"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
description = "One command to grab RTSP frames, clips, or motion alerts from your cameras."
license = "MIT"
repository = "https://github.com/steipete/qam"

[[bin]]
name = "qam"
path = "src/main.rs"

[lib]
name = "qam"
path = "src/lib.rs"

[features]
default = []
aac-enc = ["dep:fdk-aac"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
dirs = "5.0"
fdk-aac = { version = "0.6", optional = true }
futures = "0.3"
hound = "3.5"
humantime = "2.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
md-5 = "0.10"
mp4 = "0.14"
openh264 = { version = "0.9.10", features = ["source"] }
owo-colors = "4.1"
percent-encoding = "2.3"
quick-xml = "0.37"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
retina = { path = "vendor/retina" }
rust_h265 = "0.4.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha1 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
symphonia = { version = "0.5", default-features = false, features = ["aac"] }
tempfile = "3.14"
thiserror = "2.0"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "net", "time", "process", "signal", "fs", "io-util", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
webpki-roots = "0.26"

[dev-dependencies]
assert_cmd = "2.0"
criterion = { version = "0.5", features = ["html_reports"] }
insta = { version = "1.41", features = ["yaml"] }
predicates = "3.1"
proptest = "1.5"
rcgen = "0.13"
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
